# Static Godot Web client + TLS WebSocket proxy.
# Replace paths, hostname, and certificate locations for the deployment.
server {
    listen 443 ssl http2;
    server_name arena.example.com;

    ssl_certificate     /etc/letsencrypt/live/arena.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arena.example.com/privkey.pem;

    root /srv/quake_arena_web;
    index index.html;

    # A trailing slash on proxy_pass rewrites /socket/ to / for Godot.
    location /socket/ {
        proxy_pass http://127.0.0.1:8910/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        try_files $uri =404;
    }

    # The included export is single-threaded. If thread support is enabled,
    # uncomment both headers below on every Web export response.
    # add_header Cross-Origin-Opener-Policy "same-origin" always;
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;
}
